# ============================================================
# AI Travel Planner - Argo CD Application
#
# GitOps Repository의 Kubernetes Manifest를 기준으로
# Amazon EKS의 Backend Application을 관리한다.
#
# Deployment Strategy:
#   GitOps Repository
#     -> Argo CD
#     -> Manual Sync
#     -> Amazon EKS Rolling Update
#
# Auto Sync는 사용하지 않고,
# 배포 전 Diff 확인 후 Manual Sync 방식으로 운영한다.
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: travel-backend
  namespace: argocd

spec:
  project: default

  # GitOps Repository
  source:
    repoURL: https://github.com/CloudDX-Project/CI-CD.git
    targetRevision: HEAD
    path: gitops/backend

  # Argo CD가 설치된 EKS Cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: travel

  # Manual Sync
  #
  # Auto Sync를 사용하지 않는다.
  # GitOps Repository 변경 시 OutOfSync 상태를 확인하고
  # Diff 검토 후 사용자가 직접 Sync한다.
