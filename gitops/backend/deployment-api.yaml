apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-api
  namespace: travel

spec:
  replicas: 2

  selector:
    matchLabels:
      app: travel-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: travel-api

    spec:
      serviceAccountName: travel-api-sa

      containers:
        - name: travel-api

          image: 782913119640.dkr.ecr.ap-northeast-2.amazonaws.com/ai-travel-backend:schedule-gap-fix-v3-20260921
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: APP_RUNTIME_ROLE
              value: api

            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"

            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"

          envFrom:
            - configMapRef:
                name: travel-backend-config

            - secretRef:
                name: travel-backend-secret

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            failureThreshold: 18
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTP
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5
